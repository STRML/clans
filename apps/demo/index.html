<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clans — demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0f18;
        color: #d8e0ea;
        font-family: ui-monospace, Menlo, monospace;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #demo-instructions {
        max-width: 40em;
        margin: 10vh auto 0;
        padding: 0 1.5em;
        line-height: 1.5;
      }
      #demo-instructions code {
        background: rgba(255, 255, 255, 0.08);
        padding: 0.1em 0.35em;
        border-radius: 3px;
      }
      #demo-instructions a {
        color: #6fb7ff;
      }
    </style>
  </head>
  <body>
    <div id="demo-instructions" hidden>
      <h1>Clans</h1>
      <p>This is a client-only demo. It needs a Clans server to connect to.</p>
      <p>
        Run one yourself: <code>pnpm dev:server</code> from a clone of
        <a href="https://github.com/STRML/clans">github.com/STRML/clans</a>, then reload this page
        with <code>?server=ws://your-host:7777</code> appended to the URL.
      </p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
