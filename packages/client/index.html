<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clans</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0f18;
        color: #d8e0ea;
        font-family: ui-monospace, Menlo, monospace;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #debug-stats {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 6px 8px;
        background: rgba(0, 0, 0, 0.55);
        font-size: 12px;
        line-height: 1.4;
        pointer-events: none;
        white-space: pre;
      }
      /* The HUD overlays the canvas at all times (createHud never sets `hidden`). Every other
         panel here toggles `hidden` itself (station/vehicle-pad menus, the voice menu, the
         commander map); their only job here is to render as a centered overlay instead of a
         canvas-height block once shown, and to lay their button rows out sanely. */
      #hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        display: flex;
        justify-content: center;
        gap: 16px;
        padding: 0 16px;
        font-size: 14px;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }
      #hud-game-over:not(:empty) {
        position: fixed;
        top: 35%;
        left: 50%;
        transform: translateX(-50%);
        width: min(560px, 80vw);
        padding: 24px;
        background: rgba(12, 20, 28, 0.92);
        border: 1px solid #90a4ae;
        font-size: 24px;
        text-align: center;
      }
      #hud-kill-feed {
        position: fixed;
        top: 8px;
        right: 8px;
        left: auto;
        bottom: auto;
        text-align: right;
        font-size: 12px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }
      #interaction-prompt {
        position: fixed;
        left: 50%;
        top: 62%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: rgba(10, 15, 24, 0.9);
        border: 1px solid rgba(216, 224, 234, 0.5);
        border-radius: 4px;
        pointer-events: none;
      }
      #interaction-prompt[hidden] {
        display: none;
      }
      #interaction-prompt kbd {
        border: 1px solid currentColor;
        padding: 3px 7px;
        border-radius: 3px;
      }
      #station-menu h2,
      #vehicle-pad-menu h2 {
        margin: 0 0 6px;
        font-size: 18px;
      }
      #station-menu button[aria-pressed='true'] {
        background: #27556b;
        border-color: #79d8ff;
      }
      #station-menu small,
      #vehicle-pad-menu small {
        max-width: 270px;
        opacity: 0.8;
      }
      #station-menu,
      #vehicle-pad-menu,
      #voice-menu {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 16px 20px;
        background: rgba(10, 15, 24, 0.85);
        border: 1px solid rgba(216, 224, 234, 0.3);
        border-radius: 4px;
      }
      #station-menu[hidden],
      #vehicle-pad-menu[hidden],
      #voice-menu[hidden] {
        display: none;
      }
      #station-menu button,
      #vehicle-pad-menu button {
        font-family: inherit;
        font-size: 14px;
        padding: 6px 12px;
        background: rgba(216, 224, 234, 0.1);
        color: inherit;
        border: 1px solid rgba(216, 224, 234, 0.3);
        border-radius: 3px;
        cursor: pointer;
      }
      #commander-map {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 512px;
        height: 512px;
        background: rgba(10, 15, 24, 0.85);
        border: 1px solid rgba(216, 224, 234, 0.3);
      }
      #commander-map[hidden] {
        display: none;
      }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: rgba(216, 224, 234, 0.85);
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
        pointer-events: none;
      }
    </style>
    <link rel="stylesheet" href="/src/hud.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
